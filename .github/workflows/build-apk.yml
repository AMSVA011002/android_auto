name: Build T3 Auto APKs

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship the Android SDK preinstalled.
      # Just make sure platform 34 + build-tools are present.
      - name: Ensure Android SDK platform 34
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools/" || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle + generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate gradle wrapper (jar not committed)
        run: gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Build debug APKs
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: t3-auto-receiver
          path: receiver/build/outputs/apk/debug/*.apk

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: t3-car-launcher
          path: launcher/build/outputs/apk/debug/*.apk
