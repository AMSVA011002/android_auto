name: Build T3 Auto APK

on:
  push:
    branches: [main, "arena/*"]
    paths-ignore:
      - "build-output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship the Android SDK preinstalled.
      # Just make sure platform 34 + build-tools are present.
      - name: Ensure Android SDK platform 34
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools/" || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle + generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate gradle wrapper (jar not committed)
        run: gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3-auto
          path: app/build/outputs/apk/debug/*.apk

      # Artifact blobs are not always reachable from other tools, so also
      # commit the built APK into the repo under build-output/.
      - name: Publish APK to build-output/
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/*.apk build-output/t3-auto-debug.apk
          ls -l build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/t3-auto-debug.apk
          git commit -m "CI: publish t3-auto-debug.apk [skip ci]" || echo "no changes"
          git push
